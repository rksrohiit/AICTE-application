services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME to the public DNS name}
    command: >
      /bin/sh -c
      "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/nginx.conf.template
      > /etc/nginx/nginx.conf &&
      nginx -g 'daemon off;'"
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
